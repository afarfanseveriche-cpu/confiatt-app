<style>
@font-face { font-family: "Outfit"; src: url("../fonts/outfit-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root { --navy: #00222b; --navy2: #063440; --teal: #22c4b7; --suave: #aacdcd; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--navy); overflow: hidden; }
body { font-family: "Outfit", system-ui, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff;
  opacity: 0; transition: opacity .35s ease; }
#app.listo { opacity: 1; }

/* Pantalla de bienvenida */
#splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(120% 80% at 50% 40%, var(--navy2) 0%, var(--navy) 70%);
  transition: opacity .45s ease, visibility .45s; z-index: 5; }
#splash.fuera { opacity: 0; visibility: hidden; }
.logo { position: relative; width: 168px; height: 119px; }
.mitad { position: absolute; inset: 0; }
.mitad svg { width: 100%; height: 100%; display: block; }
.izq { clip-path: inset(0 50% 0 0); animation: entraIzq .9s cubic-bezier(.34,1.56,.64,1) .15s both; }
.der { clip-path: inset(0 0 0 50%); animation: entraDer .9s cubic-bezier(.34,1.56,.64,1) .15s both; }
@keyframes entraIzq { from { transform: translate(-140px,-40px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes entraDer { from { transform: translate(140px,40px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
.anillo { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 3px solid var(--teal); opacity: 0; animation: anillo 1s ease-out 1s both; }
@keyframes anillo { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
.nombre { margin-top: 30px; font-size: 44px; font-weight: 600; letter-spacing: .5px; display: flex; }
.nombre span { display: inline-block; opacity: 0; animation: letra .45s ease-out both; }
@keyframes letra { from { transform: translateY(22px); opacity: 0; } to { transform: none; opacity: 1; } }
.lema { margin-top: 10px; font-size: 15px; color: var(--suave); opacity: 0; animation: letra .5s ease-out 1.75s both; }
.carga { margin-top: 42px; width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden;
  opacity: 0; animation: letra .4s ease-out 2s both; }
.carga i { display: block; width: 40%; height: 100%; background: var(--teal); border-radius: 3px; animation: barra 1.1s ease-in-out infinite; }
@keyframes barra { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* Sin conexión / demora */
#aviso { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 32px; text-align: center; background: var(--navy); z-index: 6; }
#aviso.visible { display: flex; }
#aviso h2 { font-size: 26px; font-weight: 600; }
#aviso p { color: var(--suave); font-size: 16px; max-width: 300px; line-height: 1.4; }
#aviso button { margin-top: 10px; border: 0; border-radius: 999px; padding: 14px 30px; font: 600 17px "Outfit", system-ui;
  background: var(--teal); color: var(--navy); }
#aviso .logo-mini { width: 72px; opacity: .9; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>

  <h2 id="avisoTitulo">Sin conexión</h2>
  <p id="avisoTexto">Revisa el wifi o los datos del teléfono. Apenas vuelva la señal, el sistema se abre solo.</p>
  <button type="button" id="reintentar">Reintentar</button>
</div>

<iframe id="app" title="Confiatt" allow="clipboard-write"></iframe>

<script>
(function () {
  // Dirección del sistema (implementación /exec de Apps Script).
  var URL_SISTEMA = "https://script.google.com/macros/s/AKfycbxFeuI3FcRMI-ATg0CwmL3AhCC6y0_JaVF0FWLPVxQPGZwvj7NqpttON74-TPvZerQf/exec";
  var PANTALLAS = ["pedido", "turno", "dia", "cocina", "resumen"];
  var MIN_SPLASH = 2300;      // que se vea la animación completa
  var DEMORA_MAX = 30000;     // aviso si tarda demasiado

  var nombre = document.querySelector(".nombre");
  "Confiatt".split("").forEach(function (c, i) {
    var s = document.createElement("span"); s.textContent = c;
    s.style.animationDelay = (1.05 + i * 0.06) + "s"; nombre.appendChild(s);
  });

  var marco = document.getElementById("app");
  var splash = document.getElementById("splash");
  var aviso = document.getElementById("aviso");
  var inicio = Date.now(), listo = false, reloj = null;

  function destino() {
    var p = new URLSearchParams(location.search).get("p") || "";
    return PANTALLAS.indexOf(p) >= 0 ? URL_SISTEMA + "?p=" + p : URL_SISTEMA;
  }
  function mostrarAviso(titulo, texto) {
    document.getElementById("reintentar").textContent = listo ? "Volver al sistema" : "Reintentar";
    document.getElementById("avisoTitulo").textContent = titulo;
    document.getElementById("avisoTexto").textContent = texto;
    aviso.classList.add("visible");
  }
  function terminar() {
    if (listo) return; listo = true; clearTimeout(reloj);
    var espera = Math.max(0, MIN_SPLASH - (Date.now() - inicio));
    setTimeout(function () { marco.classList.add("listo"); splash.classList.add("fuera"); aviso.classList.remove("visible"); }, espera);
  }
  function cargar() {
    if (!navigator.onLine) {
      mostrarAviso("Sin conexión", "Revisa el wifi o los datos del teléfono. Apenas vuelva la señal, el sistema se abre solo.");
      return;
    }
    aviso.classList.remove("visible"); listo = false; inicio = Date.now();
    splash.classList.remove("fuera"); marco.classList.remove("listo");
    marco.src = destino();
    clearTimeout(reloj);
    reloj = setTimeout(function () {
      if (!listo) mostrarAviso("Está tardando más de lo normal", "La señal parece lenta. Puedes esperar o reintentar.");
    }, DEMORA_MAX);
  }

  // El sistema avisa cuando terminó de cargar; si no, se usa el evento del marco.
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.confiatt === "cargado") terminar();
  });
  marco.addEventListener("load", function () { setTimeout(terminar, 1800); });
  window.addEventListener("online", function () { if (!listo) cargar(); else aviso.classList.remove("visible"); });
  window.addEventListener("offline", function () {
    mostrarAviso("Sin conexión", listo
      ? "Se cortó la señal. Lo que estabas haciendo queda detrás de este aviso; apenas vuelva, sigue donde estabas."
      : "Revisa el wifi o los datos del teléfono. Apenas vuelva la señal, el sistema se abre solo.");
  });
  document.getElementById("reintentar").addEventListener("click", function () {
    if (listo) aviso.classList.remove("visible"); else cargar();
  });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  cargar();
})();
</script>
